name = "vp-vnp"
defaultTargets = ["Statement", "Comparator", "Paper"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]

[[lean_lib]]
name = "NS1"

[[lean_lib]]
name = "Nc"

[[lean_lib]]
name = "Ov"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Statement"
